<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registro de nuevos usuarios en el sistema">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="registro.css">
</head>

<body>

    <main class="login-container">

        <form class="form" id="registroForm" action="login.html" method="post" novalidate>

            <h2>Crear Cuenta</h2>

            <!-- ============ DATOS PERSONALES ============ -->
            <fieldset class="grupo-fieldset">
                <legend class="subtitulo-fieldset">Datos personales</legend>

                <div class="input-group">
                    <label for="regUsuario">Nombre completo</label>
                    <input
                        type="text"
                        id="regUsuario"
                        name="regUsuario"
                        placeholder="Digite su nombre completo"
                        autocomplete="name"
                        minlength="3"
                        maxlength="50"
                        pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,50}"
                        title="Solo letras y espacios (mínimo 3, máximo 50 caracteres)"
                        required>
                    <small class="error-campo" id="errorRegUsuario" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="regEmail">Correo electrónico</label>
                    <input
                        type="email"
                        id="regEmail"
                        name="regEmail"
                        placeholder="tucorreo@ejemplo.com"
                        autocomplete="email"
                        maxlength="100"
                        title="Ingresa un correo electrónico válido"
                        required>
                    <small class="error-campo" id="errorRegEmail" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="regTipoDoc">Tipo de documento</label>
                    <select id="regTipoDoc" name="regTipoDoc" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="T.I">T.I — Tarjeta de Identidad</option>
                        <option value="C.C">C.C — Cédula de Ciudadanía</option>
                    </select>
                    <small class="error-campo" id="errorRegTipoDoc" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="regNumDoc">Número de documento</label>
                    <input
                        type="text"
                        id="regNumDoc"
                        name="regNumDoc"
                        placeholder="Ej: 1023456789"
                        inputmode="numeric"
                        pattern="[0-9]{6,12}"
                        maxlength="12"
                        title="Solo números, entre 6 y 12 dígitos"
                        required>
                    <small class="error-campo" id="errorRegNumDoc" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="regFechaNac">Fecha de nacimiento</label>
                    <input
                        type="date"
                        id="regFechaNac"
                        name="regFechaNac"
                        max=""
                        title="Selecciona tu fecha de nacimiento"
                        required>
                    <small class="error-campo" id="errorRegFechaNac" aria-live="polite"></small>
                </div>
                <div class="input-group">
        <label for="regFicha">Número de Ficha</label>
        <input 
            type="text" 
            id="regFicha" 
            name="regFicha" 
            placeholder="Ej: 2555555" 
            inputmode="numeric"
            pattern="[0-9]{1,8}" 
            maxlength="8" 
            title="Solo números (máximo 8 dígitos)" 
            required>
        <small class="error-campo" id="errorRegFicha"></small>
    </div>
    <!-- Jornada -->
<div class="input-group">
    <label for="regJornada">Jornada</label>
    <select id="regJornada" name="regJornada" required>
        <option value="">Selecciona una opción</option>
        <option value="Mañana">Mañana</option>
        <option value="Tarde">Tarde</option>
        <option value="Noche">Noche</option>
        <option value="Fin de semana">Fin de semana</option>
    </select>
    <small class="error-campo" id="errorRegJornada" aria-live="polite"></small>
</div>
            </fieldset>

            <!-- ============ DATOS DEL ACUDIENTE (solo si es menor) ============ -->
            <fieldset class="grupo-fieldset" id="campoAcudiente" hidden>
                <legend class="subtitulo-fieldset">Datos del acudiente (menor de edad)</legend>

                <div class="input-group">
                    <label for="regNombreAcudiente">Nombre del acudiente</label>
                    <input
                        type="text"
                        id="regNombreAcudiente"
                        name="regNombreAcudiente"
                        placeholder="Nombre completo del acudiente"
                        autocomplete="name"
                        minlength="3"
                        maxlength="50"
                        pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,50}"
                        title="Solo letras y espacios (mínimo 3, máximo 50 caracteres)">
                    <small class="error-campo" id="errorRegNombreAcudiente" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="regTelAcudiente">Teléfono del acudiente</label>
                    <input
                        type="tel"
                        id="regTelAcudiente"
                        name="regTelAcudiente"
                        placeholder="Ej: 3001234567"
                        inputmode="numeric"
                        pattern="[0-9]{7,10}"
                        maxlength="10"
                        title="Solo números, entre 7 y 10 dígitos">
                    <small class="error-campo" id="errorRegTelAcudiente" aria-live="polite"></small>
                </div>
            </fieldset>

            <!-- ============ CONTRASEÑA ============ -->
            <fieldset class="grupo-fieldset">
                <legend class="subtitulo-fieldset">Credenciales de acceso</legend>

                <div class="input-group">
                    <label for="regPassword">Contraseña</label>
                    <input
                        type="text"
                        id="regPassword"
                        name="regPassword"
                        placeholder="Crea una contraseña"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="100"
                        title="La contraseña debe tener al menos 6 caracteres"
                        required>
                    <small class="error-campo" id="errorRegPassword" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="regPassword2">Confirmar contraseña</label>
                    <input
                        type="text"
                        id="regPassword2"
                        name="regPassword2"
                        placeholder="Repite la contraseña"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="100"
                        title="Repite la misma contraseña"
                        required>
                    <small class="error-campo" id="errorRegPassword2" aria-live="polite"></small>
                </div>
            </fieldset>

            <div class="input-group terminos-grupo">
    <label class="checkbox-terminos">
        <input type="checkbox" id="aceptaTerminos" name="aceptaTerminos" required>
        <span class="texto-terminos">
            He leído y acepto los
            <a href="#" id="abrirTerminos">Términos y Condiciones</a>
            y la
            <a href="#" id="abrirPrivacidad">Política de Privacidad</a>
        </span>
    </label>
    <small class="error-campo" id="errorAceptaTerminos" aria-live="polite"></small>
</div>

            <button type="submit" class="btn">Registrarse</button>

            <p class="mensaje" id="mensajeRegistro" role="status" aria-live="polite"></p>

            <p class="cambio-form">
                ¿Ya tienes cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>
        </form>
    </main>

    <script src="registro.js"></script>
    
    <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-contenido" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
        <header class="modal-header">
            <h3 id="modalTitulo">Título</h3>
            <button type="button" class="modal-cerrar" id="cerrarModal" aria-label="Cerrar">×</button>
        </header>
        <div class="modal-body" id="modalBody">
            <!-- El contenido se inyecta desde JS -->
        </div>
        <footer class="modal-footer">
            <button type="button" class="btn btn-modal" id="aceptarModal">Entendido</button>
        </footer>
    </div>
</div>
>
</body>

</html>
